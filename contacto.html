<body>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="progreso" aria-hidden="true"></div>

  <header class="nav">
    <a href="index.html" class="logo" id="logo" aria-label="Inicio"></a>
    <nav aria-label="Principal">
      <button class="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <ul class="links"></ul>
    </nav>
    <button class="tema" aria-label="Cambiar tema">◐</button>
  </header>

  <main>
    <section class="pagina-hero ">
      <canvas id="particulas" aria-hidden="true"></canvas>
      <div class="burbuja b1" data-parallax="0.25" aria-hidden="true"></div>
      <div class="burbuja b2" data-parallax="-0.15" aria-hidden="true"></div>
      <div class="pagina-hero-contenido">
        <p class="saludo">Contacto</p>
        <h1 >Hablemos de tu contenido</h1>
        <p class="lead" id="h-lead">¿Tienes un proyecto, una marca que necesita estrategia o una vacante? Escríbeme.</p>

      </div>
    </section>

    <section class="seccion">
      <div class="contacto-grid">
        <div class="revelar">
          <h2 class="subtitulo">Escríbeme directo</h2>
          <p><a id="email-link" class="email"></a></p>
          <p id="ubicacion" class="muted"></p>
          <ul class="redes izq" id="redes-contacto"></ul>
          <div class="botones izq">
            <a href="#" id="btn-cv" class="btn" target="_blank" rel="noopener">Descargar CV</a>
            <a href="#" id="btn-pdf" class="btn" target="_blank" rel="noopener">Portafolio PDF</a>
          </div>
        </div>
        <form id="formulario" class="formulario revelar">
          <label>Nombre<input name="nombre" required autocomplete="name"></label>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>Servicio<select name="servicio"></select></label>
          <label>Mensaje<textarea name="mensaje" rows="5" required></textarea></label>
          <button class="btn primario" type="submit">Enviar mensaje</button>
          <p class="estado" id="estado" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="pie">
    <p>© <span id="anio"></span> <span id="pie-nombre"></span></p>
    <a href="#" class="arriba" aria-label="Volver arriba">↑ Arriba</a>
  </footer>
