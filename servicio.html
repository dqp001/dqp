<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio · Daniela Quintana</title>
  <meta name="description" content="Detalle de un servicio de Daniela Quintana.">
  <meta property="og:title" content="Servicio · Daniela Quintana">
  <meta property="og:description" content="Detalle de un servicio de Daniela Quintana.">
  <meta property="og:image" content="img/koud-linkedin-mini.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23ff5a6e'/><text x='50' y='66' font-size='46' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>DQ</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="progreso" aria-hidden="true"></div>

  <header class="nav">
    <a href="index.html" class="logo" id="logo" aria-label="Inicio"></a>
    <nav aria-label="Principal">
      <button class="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <ul class="links"></ul>
    </nav>
    <button class="tema" aria-label="Cambiar tema">◐</button>
  </header>

  <main>
    <section class="pagina-hero servicio-hero">
      <canvas id="particulas" aria-hidden="true"></canvas>
      <div class="burbuja b1" data-parallax="0.25" aria-hidden="true"></div>
      <div class="burbuja b2" data-parallax="-0.15" aria-hidden="true"></div>
      <div class="pagina-hero-contenido">
        <p class="saludo">Servicio</p>
        <h1 id="h-titulo"></h1>
        <p class="lead" id="h-lead"></p>
        <span class="servicio-icono gigante" id="h-icono" aria-hidden="true"></span>
      </div>
    </section>

    <section class="seccion">
      <div class="sobre-grid">
        <div class="revelar">
          <h2 class="titulo">De qué se trata</h2>
          <p class="lead" id="s-descripcion"></p>
          <div class="ideal revelar"><h4>Ideal para</h4><p id="s-ideal"></p></div>
        </div>
        <div class="revelar">
          <h2 class="titulo">Qué incluye</h2>
          <ul class="check grande" id="s-incluye"></ul>
        </div>
      </div>
    </section>

    <section class="seccion">
      <div class="dos-col">
        <div class="revelar"><h3 class="subtitulo">Cómo lo mido</h3><ul class="chips grande" id="s-metricas"></ul></div>
        <div class="revelar"><h3 class="subtitulo">Herramientas</h3><ul class="chips grande" id="s-herramientas"></ul></div>
      </div>
    </section>

    <section class="seccion">
      <div class="cabecera-seccion">
        <h2 class="titulo">Proyectos con este servicio</h2>
        <a href="proyectos.html" id="s-ver-todos" class="enlace-mas">Ver en Proyectos →</a>
      </div>
      <div class="proyectos" id="s-proyectos"></div>
    </section>

    <section class="seccion">
      <div class="cta-final revelar">
        <h2 id="s-cta"></h2>
        <div class="botones">
          <a href="contacto.html" id="s-contacto" class="btn primario">Quiero este servicio</a>
          <a href="servicios.html" class="btn">Ver otros servicios</a>
        </div>
      </div>
      <nav class="servicio-nav" id="s-nav" aria-label="Otros servicios"></nav>
    </section>
  </main>

  <footer class="pie">
    <p>© <span id="anio"></span> <span id="pie-nombre"></span></p>
    <a href="#" class="arriba" aria-label="Volver arriba">↑ Arriba</a>
  </footer>

  <script src="datos.js"></script>
  <script src="comun.js"></script>
  <script src="servicio.js"></script>
</body>
</html>
